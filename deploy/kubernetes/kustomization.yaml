apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rds-csi

resources:
  - rbac.yaml
  - csidriver.yaml
  - controller.yaml
  - node.yaml

# Images can be customized here
images:
  - name: ghcr.io/3whiskeywhiskey/rds-csi
    newTag: latest

# Configure the rds-csi-config ConfigMap in controller.yaml or an overlay.
# Create rds-csi-secret separately with rds-private-key and rds-host-key.
# Do not add credential files to this kustomization.

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: rds-csi-driver
  app.kubernetes.io/component: csi-driver
  app.kubernetes.io/part-of: storage

# Common annotations
commonAnnotations:
  description: "MikroTik RDS NVMe/TCP CSI Driver"
